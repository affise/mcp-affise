name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same ref when a new commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build + test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm

      # `npm ci` installs exactly the locked tree. It fails only on a dependency
      # the lockfile cannot satisfy — NOT on a stale version or licence field,
      # and not on a dependency missing from the lockfile's root entry while
      # present in the tree as a transitive. Measured: a lockfile reading an
      # old version and licence, with `zod` absent from its root dependencies,
      # installed cleanly. Version and licence agreement is asserted by the
      # suite and, at the only moment that matters, by the pre-publish gate in
      # publish.yml.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Build (skip security audit — covered by Dependabot)
        run: npm run build:unsafe

      - name: Run test suite
        run: npm test
        env:
          NODE_ENV: test
